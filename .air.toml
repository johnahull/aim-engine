root = "."
tmp_dir = "tmp"

[build]
# LDFLAGS mirror `make build` so dev binaries bake ARTIFACT_DOWNLOADER_IMG into
# api/v1alpha1.DefaultDownloadImage; without it the operator hits the empty
# default and refuses to start. Keep the registry in step with the Makefile - a
# reference that resolves nowhere only surfaces later as ErrImagePull. A rolling
# `:latest` would let download Jobs reuse stale cached layers on the node.
cmd = "go build -ldflags \"-X 'github.com/amd-enterprise-ai/aim-engine/api/v1alpha1.DefaultDownloadImage=docker.io/amdenterpriseai/aim-artifact-downloader:$(git describe --tags --abbrev=0 2>/dev/null || echo dev)'\" -o ./.tmp/manager ./cmd/main.go"
# Entrypoint: wrapper script with log rotation (keeps 10 most recent in .tmp/logs/)
entrypoint = ["./hack/run-manager.sh"]
# Watch these extensions
include_ext = ["go"]
# Ignore these directories
exclude_dir = [".tmp", "vendor", "tests", "docs", "config", "dist", "hack", "third-party-licenses"]
# Ignore generated files
exclude_regex = ["_test\\.go$", "zz_generated.*\\.go$"]
# Delay before rebuilding (ms)
delay = 500

[log]
main_only = true

[color]
main = "yellow"
watcher = "cyan"
build = "green"

[misc]
clean_on_exit = true
