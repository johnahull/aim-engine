# LoRA adapter support — minimal MVP worked example.
#
# MVP contract (see docs/docs/explanation/lora-adapters.md):
#   * Adapter-enabled profile caches request a shared adapter disk
#     automatically. Configure a RWX-capable storage class through RuntimeConfig.
#   * Adapters are reference-only. spec.adapterMode selects the contract:
#     static (the default, shown here) mounts the adapter disk with a
#     create-time-fixed set and freezes spec.adapters; dynamic allows editing
#     spec.adapters after creation and mounts the disk even at zero adapters, so
#     add/remove never restarts the pod. adapterMode is immutable after creation.
#   * The resolved profile must have exactly one model source, and the base
#     model must be cached with `Shared` caching and an exact sourceUri match.
#   * The resolved profile must advertise features: [adapters]. For a legacy or
#     custom profile whose image is known to support the adapter contract, set
#     spec.profileOverrides.features: [adapters] explicitly.
---
# 1. Optional pre-created parent base model with an adapter disk. This keeps the
#    sample standalone; normally an adapter-enabled profile cache creates or
#    updates the model artifact and requests the adapter disk automatically.
#    The artifact provisions two PVCs: model cache and shared RWX adapter disk.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  labels:
    app.kubernetes.io/name: aim-engine
    app.kubernetes.io/managed-by: kustomize
  name: gemma-3-27b-it-cache
spec:
  type: model
  modelId: google/gemma-3-27b-it
  sourceUri: hf://google/gemma-3-27b-it
  size: 60Gi
  adapterDisk:
    size: 50Gi
---
# 2. A shared, pre-authored adapter logically compatible with the canonical
#    base model ID. It is not owned by this concrete AIMArtifact.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  labels:
    app.kubernetes.io/name: aim-engine
    app.kubernetes.io/managed-by: kustomize
  name: cs-tone-v3
spec:
  type: adapter
  modelId: acme/cs-tone-v3
  compatibleWith:
    - google/gemma-3-27b-it
  sourceUri: s3://eai-artifacts/adapters/cs-tone-v3/
  rank: 16
---
# 3. A v1alpha2 service that serves the adapter. The adapter is staged into this
#    service's isolated subtree of the shared adapter disk and mounted read-only
#    at /adapters. adapterMode: static (the default) => spec.adapters is fixed.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  labels:
    app.kubernetes.io/name: aim-engine
    app.kubernetes.io/managed-by: kustomize
  name: gemma-cs
spec:
  profile:
    name: gemma-3-27b-it-mi300x-bf16
  adapterMode: static # default; optional. Use "dynamic" to edit adapters later.
  adapters:
    - name: cs-tone-v3
      kind: AIMArtifact
