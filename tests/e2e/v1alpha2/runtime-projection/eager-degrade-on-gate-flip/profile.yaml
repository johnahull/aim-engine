# Namespace-scoped mirror of cluster-profile.yaml for the same gate-flip
# scenario. Projectable in this MI300X vcluster, so the AIMProfile
# reconciler (the Exhaustive branch of default Both mode) eagerly projects a complete
# ServingRuntime named aim-<profile.Name> (+ its colocated profile ConfigMap).
# Applied into the ephemeral chainsaw namespace.
#
# After the gate flip (acceleratorModel patched to an unsatisfiable value) the
# SR must SURVIVE (additive teardown) and the profile must report
# RuntimeProjected=False/RuntimeDegraded. The image is a placeholder.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: test-degrade-sr
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  acceleratorModel: MI300X
  acceleratorType: gpu
  acceleratorCount: 1
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
