# Backing cluster profile for the lazily-projected runtime. No accelerator
# fields, so it has no hardware requirement and reaches Ready in any cluster
# (kind or GPU vcluster). Deployable: aimId + modelSources are both set, so the
# shared builder can turn it into a complete, Path-A-ready namespace runtime.
# The test patches spec.image and asserts the materialized namespace runtime
# picks up the new image.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-profile-drift
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
