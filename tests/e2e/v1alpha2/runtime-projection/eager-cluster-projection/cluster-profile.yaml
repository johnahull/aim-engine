# Backing cluster profile for the eager Exhaustive projection (chain a). No
# accelerator fields, so it has no hardware requirement and reaches Ready in any
# cluster (kind or GPU vcluster). Deployable: aimId + modelSources are both set,
# so it is projectable (deployable && image != "" && no accelerator) and the
# AIMClusterProfile reconciler eagerly projects a bare ClusterServingRuntime
# named aim-test-eager-csr-<hash> (prefix-reserved truncate+hash of the
# profile name; see status.projectedRuntimeName), owner-ref'd by this profile.
#
# The image is a placeholder (registry.example.com): chain (a) asserts the
# projection contract (CSR shape, labels, owner ref, GC), not that a pod serves.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-eager-csr
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
