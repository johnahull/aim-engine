# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Phase D chain (a): eager per-profile projection of an AIMClusterProfile into a
# ClusterServingRuntime.
#
# Apply a deployable, no-accelerator AIMClusterProfile. The cluster profile
# reconciler (the Exhaustive branch of the default Both mode) projects a bare
# ClusterServingRuntime named aim-<profile.Name>, owner-ref'd by the
# profile, force-applied (reserved aim- prefix), with the correlator labels and
# autoSelect off. Deleting the profile garbage-collects the CSR via the owner
# reference.
#
# No accelerator and no cache/PVC, so this reaches the projection contract in any
# cluster with no special infrastructure.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-projection-eager-cluster-projection
spec:
  timeouts:
    assert: 120s
  steps:
    - name: Apply the cluster profile and wait for Ready
      try:
        - apply:
            file: cluster-profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfile
              metadata:
                name: test-eager-csr
              status:
                status: Ready
                # The projected per-profile runtime name is published on
                # status (the deterministic profile→runtime lookup that replaces the
                # reverse name strip). It equals the hashed CSR name asserted below.
                projectedRuntimeName: aim-test-eager-csr-01b0d118
                (conditions[?type == 'RuntimeProjected']):
                  - status: "True"
                    reason: RuntimeProjected

    - name: Assert the ClusterServingRuntime is projected and owner-ref'd
      description: |
        The bare CSR is named aim-<truncated-profile>-<hash> (prefix-
        reserved truncate+hash, unguessable so the force-apply is safe by
        construction), carries the correlator labels (managed-by, component,
        profile), references the profile image, has autoSelect off, and is
        owner-ref'd by the AIMClusterProfile for GC.
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ClusterServingRuntime
              metadata:
                name: aim-test-eager-csr-01b0d118
                labels:
                  app.kubernetes.io/managed-by: aim-engine
                  app.kubernetes.io/component: inference
                  aim.eai.amd.com/profile: test-eager-csr
                (ownerReferences[?kind == 'AIMClusterProfile']):
                  - name: test-eager-csr
              spec:
                supportedModelFormats:
                  - name: huggingface
                    autoSelect: false
                containers:
                  - name: kserve-container
                    image: registry.example.com/aim-cpu-base:0.12.0

    - name: Delete the cluster profile and assert the CSR is garbage-collected
      try:
        - delete:
            ref:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMClusterProfile
              name: test-eager-csr
        - error:
            timeout: 60s
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ClusterServingRuntime
              metadata:
                name: aim-test-eager-csr-01b0d118
