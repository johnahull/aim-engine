# Backing cluster profile for the bare-CSR reconvergence test. Same shape as the
# lazy-shadow fixture: no accelerator fields (Ready in any cluster — kind or GPU
# vcluster) and aimId + modelSources set, so the shared builder can turn it into
# a complete, Path-A-ready namespace runtime once the lazy watcher fires.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: test-bare-csr
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
