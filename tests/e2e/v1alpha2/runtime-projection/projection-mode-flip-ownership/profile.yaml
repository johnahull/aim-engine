# Backing namespace profile for the projection-mode-flip ownership test.
#
# Primary and no accelerator on purpose:
#   - no accelerator => reaches Ready in any cluster (kind or GPU vcluster);
#   - primary + Reduced => the eager AIMProfile reconciler projects the portable
#     model-slug runtime, but NOT the hashed per-profile runtime referenced by
#     the AIMService. That per-profile runtime can only be materialized by the
#     always-on lazy projection and is the object handed to the eager path.
# The retained model-slug runtime is also patched after the switch to Exhaustive,
# proving the now-disabled projection type remains actively maintained.
#
# Deployable (aimId + modelSources both set), so once the mode flips to
# Exhaustive the eager per-profile projection turns on for the SAME hashed name
# (aim-flip-ns-profile-bba2ad9c) and reclaims the runtime.
#
# The image is a placeholder (registry.example.com): the test asserts the
# ownership-settling contract (marker + resourceVersion stability), decided at
# render time, not that a pod pulls and serves.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: flip-ns-profile
spec:
  aimId: Qwen/Qwen3-0.6B
  modelId: Qwen/Qwen3-0.6B
  engine: vllm
  metric: latency
  precision: bf16
  type: general
  primary: true
  image: registry.example.com/aim-cpu-base:0.12.0
  modelSources:
    - modelId: Qwen/Qwen3-0.6B
      sourceUri: hf://Qwen/Qwen3-0.6B
      # Small PVC: the download is simulated (no real bytes), so this only needs
      # to provision, not hold real weights.
      size: 1Gi
