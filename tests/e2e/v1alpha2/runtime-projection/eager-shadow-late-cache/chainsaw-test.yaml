# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# Eager per-profile runtime gains a service-driven Shared cache mount.
#
# This is the regression guard for the mode-dependent Shared-cache mount. Under
# the default Both mode the profile controller's Exhaustive branch eagerly
# projects a complete namespace ServingRuntime for a projectable namespace
# profile. That eager runtime
# must mount a Shared AIMProfileCache created out-of-band (as an AIMService in the
# default Shared caching mode does) even though the profile never set
# caching.enabled and the cache carries a hashed object name, not the profile
# name. Previously the eager path only looked up a cache named after the profile
# gated on caching.enabled, so the Shared cache went unmounted and the pod
# cold-pulled its weights — while the same service worked in Reduced mode via the
# lazy shadow. The mount is now resolved identically on both paths.
#
# The cache is applied LATE and frozen to Ready (apply-with-status.sh), first
# without observedGeneration. A forced profile reconcile proves that stale cache
# status preserves the existing cacheless runtime instead of degrading the
# profile. Once observedGeneration catches up, the AIMProfileCache watch
# reprojects the eager runtime with the PVC volume.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: runtime-projection-eager-shadow-late-cache
spec:
  timeouts:
    assert: 120s
  steps:
    - name: Create the deployable namespace profile
      try:
        - apply:
            file: profile.yaml
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: test-eager-cache
              status:
                status: Ready

    - name: Assert the eager per-profile ServingRuntime is projected WITHOUT the cache volume
      description: |
        No AIMProfileCache exists yet, so the runtime carries the colocated
        profile ConfigMap volume and the modelSources redirect env, but NO
        PVC-backed cache volume.
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ServingRuntime
              metadata:
                name: aim-test-eager-cache-6d4bb9bf
                labels:
                  app.kubernetes.io/managed-by: aim-engine
                  aim.eai.amd.com/profile: test-eager-cache
                (ownerReferences[?kind == 'AIMProfile']):
                  - name: test-eager-cache
              spec:
                (volumes[?configMap.name == 'aim-test-eager-cache-6d4bb9bf']):
                  - name: aim-profile
                (volumes[?persistentVolumeClaim] | length(@)): 0

    - name: Seed a Ready Shared cache whose status has not observed its generation
      try:
        - apply:
            file: profile-cache.yaml
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              apply-with-status.sh profile-cache.yaml --status-only -n "$NAMESPACE"
              observed="$(kubectl -n "$NAMESPACE" get aimprofilecache test-eager-cache-cache-5e1f0a3b -o jsonpath='{.status.observedGeneration}')"
              if [ -n "$observed" ]; then
                echo "expected observedGeneration to be omitted, got $observed"
                exit 1
              fi
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileCache
              metadata:
                name: test-eager-cache-cache-5e1f0a3b
              status:
                status: Ready

    - name: Reconcile the profile while cache status is stale and preserve its runtime
      description: |
        Changing a valid profile field increments metadata.generation, giving
        the test an observable proof that the profile controller reconciled
        after the unobserved cache appeared. The profile must remain Ready,
        ProfileCacheLookupFailed must not be emitted, and the existing runtime
        must remain untouched until cache status catches up.
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              kubectl -n "$NAMESPACE" patch aimprofile test-eager-cache --type=merge \
                -p '{"spec":{"metric":"throughput"}}'
              generation="$(kubectl -n "$NAMESPACE" get aimprofile test-eager-cache -o jsonpath='{.metadata.generation}')"
              attempts=0
              while [ "$attempts" -lt 60 ]; do
                observed="$(kubectl -n "$NAMESPACE" get aimprofile test-eager-cache -o jsonpath='{.status.observedGeneration}')"
                if [ "$observed" = "$generation" ]; then
                  exit 0
                fi
                attempts=$((attempts + 1))
                sleep 1
              done
              kubectl -n "$NAMESPACE" get aimprofile test-eager-cache -o yaml
              exit 1
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: test-eager-cache
              status:
                status: Ready
                (conditions[?reason == 'ProfileCacheLookupFailed'] | length(@)): 0
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ServingRuntime
              metadata:
                name: aim-test-eager-cache-6d4bb9bf
              spec:
                (volumes[?persistentVolumeClaim] | length(@)): 0

    - name: Mark the current cache generation observed
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              generation="$(kubectl -n "$NAMESPACE" get aimprofilecache test-eager-cache-cache-5e1f0a3b -o jsonpath='{.metadata.generation}')"
              kubectl -n "$NAMESPACE" patch aimprofilecache test-eager-cache-cache-5e1f0a3b \
                --subresource=status --type=merge \
                -p "{\"status\":{\"observedGeneration\":$generation}}"
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfileCache
              metadata:
                name: test-eager-cache-cache-5e1f0a3b
              status:
                observedGeneration: 1
                status: Ready

    - name: Assert the eager ServingRuntime gains the PVC cache volume, mount, and redirect env
      description: |
        The Ready cache re-enqueues the profile via the AIMProfileCache watch and
        the eager runtime is re-projected with the profile-owned cache volume
        (claim eager-cache-weights-pvc), its mount at the cache mountPoint, and the
        modelSources redirect env (AIM_CACHE_PATH, AIM_MODEL_ID, AIM_ID="").
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ServingRuntime
              metadata:
                name: aim-test-eager-cache-6d4bb9bf
              spec:
                (volumes[?persistentVolumeClaim.claimName == 'eager-cache-weights-pvc']):
                  - name: eager-cache-weights
                (containers[0].volumeMounts[?name == 'eager-cache-weights'].mountPath | [0]): /workspace/cache/Qwen/Qwen3-0.6B
                (containers[0].env[?name == 'AIM_CACHE_PATH'].value | [0]): /workspace/cache
                (containers[0].env[?name == 'AIM_MODEL_ID'].value | [0]): Qwen/Qwen3-0.6B
                (containers[0].env[?name == 'AIM_ID'] | length(@)): 1
                (containers[0].env[?name == 'AIM_ID' && value] | length(@)): 0
