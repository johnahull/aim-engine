apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: part-service
  annotations:
    # Route spec.model.name through the profile pipeline so the resolver picks
    # the deployable AIMProfiles owned by the derivation model (not the v1alpha1
    # template path, which doesn't understand derivedFrom chains).
    aim.eai.amd.com/reconciler-pipeline: profile
spec:
  model:
    name: part-derived
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
