# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService Frozen Test: Profile Ready (v1alpha2)
#
# This test validates that a v1alpha2 AIMService correctly resolves a Ready
# AIMClusterProfile and emits an InferenceService that references the projected
# runtime (aim-<profile>) instead of inlining a predictor. The always-on lazy
# runtime-projection reconciler materializes the colocated profile ConfigMap and
# the namespace ServingRuntime (which carries the profile image), even though the
# profile itself is reconciliation-paused.
#
# Test type: Frozen dependency test
# Frozen resources: AIMClusterProfile (Ready)
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: profile-ready
  labels:
    hf-access: live
spec:
  timeouts:
    assert: 60s
  steps:
    - use:
        template: ../../../_shared/hf-token-step.yaml

    - name: Create frozen cluster profile with Ready status
      try:
        - apply:
            file: cluster-profile.yaml
        - script:
            content: |
              apply-with-status.sh cluster-profile.yaml --status-only

    - name: Create v1alpha2 service referencing the profile
      try:
        - apply:
            file: service.yaml

    - name: Freeze profile cache and artifact to Ready
      # The profile carries a fake hf:// source, so the AIMArtifact controller
      # would otherwise mark the artifact InvalidSpec (Repository Not Found)
      # and the AIMProfileCache would never reach Ready, blocking ISVC
      # creation. We pause reconciliation on both and patch them to Ready,
      # the same approach used by profile-cache-ready.
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu

              for _ in $(seq 1 30); do
                PC_NAME=$(kubectl get aimprofilecache -n "$NAMESPACE" \
                  -l aim.eai.amd.com/service=test-service \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                ART_NAME=$(kubectl get aimartifact -n "$NAMESPACE" \
                  -l aim.eai.amd.com/profile.name=test-profile-ready \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
                if [ -n "$PC_NAME" ] && [ -n "$ART_NAME" ]; then
                  break
                fi
                sleep 1
              done

              if [ -z "$PC_NAME" ] || [ -z "$ART_NAME" ]; then
                echo "ERROR: profile cache or artifact not found in time"
                kubectl get aimprofilecache,aimartifact -n "$NAMESPACE" -o wide || true
                exit 1
              fi
              echo "Found AIMProfileCache=$PC_NAME AIMArtifact=$ART_NAME"

              # AIMProfileCache.status.artifacts[*].uid is a required field, so
              # mirror the real AIMArtifact's UID into the frozen cache status.
              ART_UID=$(kubectl get aimartifact "$ART_NAME" -n "$NAMESPACE" \
                -o jsonpath='{.metadata.uid}')

              kubectl annotate aimprofilecache "$PC_NAME" -n "$NAMESPACE" \
                aim.eai.amd.com/reconciliation-paused=true --overwrite
              kubectl annotate aimartifact "$ART_NAME" -n "$NAMESPACE" \
                aim.eai.amd.com/reconciliation-paused=true --overwrite

              kubectl patch aimartifact "$ART_NAME" -n "$NAMESPACE" \
                --type=merge --subresource=status \
                -p '{
                  "status": {
                    "status": "Ready",
                    "conditions": [
                      {
                        "type": "Ready",
                        "status": "True",
                        "reason": "Ready",
                        "message": "Artifact frozen Ready by chainsaw test",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      }
                    ],
                    "persistentVolumeClaim": "'"$ART_NAME"'-pvc"
                  }
                }'

              kubectl patch aimprofilecache "$PC_NAME" -n "$NAMESPACE" \
                --type=merge --subresource=status \
                -p '{
                  "status": {
                    "status": "Ready",
                    "conditions": [
                      {
                        "type": "ProfileFound",
                        "status": "True",
                        "reason": "ProfileResolved",
                        "message": "Profile resolved",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      },
                      {
                        "type": "ArtifactsReady",
                        "status": "True",
                        "reason": "AllCachesReady",
                        "message": "All artifacts are ready",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      },
                      {
                        "type": "Ready",
                        "status": "True",
                        "reason": "Ready",
                        "message": "Profile cache frozen Ready by chainsaw test",
                        "lastTransitionTime": "2025-01-01T00:00:00Z"
                      }
                    ],
                    "artifacts": {
                      "'"$ART_NAME"'": {
                        "name": "'"$ART_NAME"'",
                        "uid": "'"$ART_UID"'",
                        "model": "test/profile-model",
                        "status": "Ready",
                        "persistentVolumeClaim": "'"$ART_NAME"'-pvc",
                        "mountPoint": "/workspace/cache/test/profile-model"
                      }
                    }
                  }
                }'

              echo "Patched $PC_NAME and $ART_NAME to Ready"

    - name: Assert service resolves profile and has ProfileReady condition
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  name: test-profile-ready
                  scope: Cluster

    - name: Assert the colocated profile ConfigMap is materialized on the referenced runtime
      # Post slice-06 the AIMService no longer emits its own profile ConfigMap.
      # The runtime projection materializes a colocated ConfigMap named
      # aim-<profile>, labeled with the profile (not the service).
      try:
        - assert:
            resource:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: aim-test-profile-ready-512bfbd6
                labels:
                  app.kubernetes.io/managed-by: aim-engine
                  app.kubernetes.io/component: inference
                  aim.eai.amd.com/profile: test-profile-ready

    - name: Assert the InferenceService references the projected runtime, inlining nothing
      # Post slice-06 the overlay references aim-<profile> by name with the
      # huggingface model format and carries no inline predictor container; the
      # profile image lives on the projected ServingRuntime asserted below.
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-service
                  aim.eai.amd.com/profile: test-profile-ready
                annotations:
                  aim.eai.amd.com/runtime-profile: test-profile-ready
              spec:
                predictor:
                  model:
                    runtime: aim-test-profile-ready-512bfbd6
                    modelFormat:
                      name: huggingface

    - name: Assert the projected namespace ServingRuntime carries the profile image
      # The lazy InferenceService-watch reconciler materializes a complete
      # namespace ServingRuntime (owned by the cluster profile) that holds the
      # profile image and mounts the colocated profile ConfigMap.
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1alpha1
              kind: ServingRuntime
              metadata:
                name: aim-test-profile-ready-512bfbd6
                labels:
                  app.kubernetes.io/managed-by: aim-engine
                  aim.eai.amd.com/profile: test-profile-ready
                (ownerReferences[?kind == 'AIMClusterProfile']):
                  - name: test-profile-ready
              spec:
                (containers[?name == 'kserve-container'].image | [0]): registry.example.com/test-image:1.0.0
                (volumes[?configMap.name == 'aim-test-profile-ready-512bfbd6']):
                  - name: aim-profile

    - name: Assert service reaches a runtime bring-up state (not Ready/Failed)
      # The predictor image is intentionally fake, so the pod never runs and the
      # exact rollup status depends on kubelet pull/back-off timing (Pending vs
      # Starting vs Progressing). Assert the service is in any non-terminal
      # bring-up state rather than a single transient value to avoid a timing race.
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-service
              status:
                (status == 'Starting' || status == 'Pending' || status == 'Progressing'): true
