# Frozen profile with one model source, allowing deterministic adapter parent
# resolution without deploying an inference workload.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMClusterProfile
metadata:
  name: adapters-staging-failed-profile
  annotations:
    aim.eai.amd.com/reconciliation-paused: "true"
spec:
  aimId: test/adapters-staging-failed
  modelId: test/adapters-staging-failed
  engine: vllm
  metric: latency
  precision: fp16
  type: unoptimized
  primary: true
  image: registry.example.com/test-image:1.0.0
  features:
    - adapters
  modelSources:
    - modelId: test-org/failure-base
      sourceUri: hf://test-org/failure-base
      size: 10Mi
status:
  status: Ready
  version: 1.0.0
  hardwareSummary: CPU
  matchingNodes: 1
  conditions:
    - type: HardwareAvailable
      status: "True"
      reason: NoAcceleratorSpecified
      message: No accelerator specified, profile is available on any node
      lastTransitionTime: "2025-01-01T00:00:00Z"
