# Service with NO replicas specified - should default to 1
# Template is auto-selected from model's discovered templates
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-replicas-default-service
spec:
  model:
    name: test-replicas-default-model
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  # Note: No replicas, minReplicas, or maxReplicas specified
  # Should default to 1 replica
