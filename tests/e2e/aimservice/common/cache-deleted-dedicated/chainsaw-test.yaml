# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService E2E Test: Dedicated Cache Deleted - Recovers
#
# Validates that when a dedicated AIMTemplateCache is deleted:
# 1. The InferenceService preserves its PVC volume mounts (no disruption)
# 2. A replacement cache with a new UID is automatically created
# 3. The replacement cache becomes Ready
# 4. The AIMService references the replacement cache and recovers to Running
#
# Note: This test requires external network access for model downloads.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aimservice-cache-deleted-dedicated
  labels:
    requires: external-network
    hf-access: live
spec:
  description: Test that deleting a dedicated template cache triggers recreation and service recovery
  timeouts:
    assert: 300s
  steps:
    - use:
        template: ../../../_shared/hf-token-step.yaml

    - name: Create service with dedicated caching
      try:
        - apply:
            file: service.yaml

    - name: Wait for template cache to become Ready
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMTemplateCache
              metadata:
                labels:
                  aim.eai.amd.com/service.name: cache-deleted-dedicated-svc
              status:
                status: Ready

    - name: Verify AIMService reaches Running with cache ready
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: cache-deleted-dedicated-svc
              status:
                status: Running
                (conditions[?type == 'CacheReady']):
                  - status: "True"
                    reason: CacheReady

    - name: Verify InferenceService has PVC volume from cache
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              PVC_COUNT=$(kubectl get inferenceservice -n "${NAMESPACE}" \
                -l aim.eai.amd.com/service=cache-deleted-dedicated-svc \
                -o jsonpath='{range .items[*].spec.predictor.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' \
                | grep -c .)
              echo "Found ${PVC_COUNT} PVC volume(s) on InferenceService"
              [ "${PVC_COUNT}" -ge 1 ]

    - name: Verify InferenceService is ready before cache deletion
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: cache-deleted-dedicated-svc
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"

    - name: Delete the template cache and artifacts
      try:
        - script:
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              CACHE_NAME=$(kubectl get aimtemplatecache -n "${NAMESPACE}" \
                -l aim.eai.amd.com/service.name=cache-deleted-dedicated-svc \
                -o jsonpath='{.items[0].metadata.name}')
              CACHE_UID=$(kubectl get aimtemplatecache "${CACHE_NAME}" -n "${NAMESPACE}" \
                -o jsonpath='{.metadata.uid}')
              echo "Deleting cache ${CACHE_NAME} with UID ${CACHE_UID}"
              kubectl create configmap cache-deleted-dedicated-state -n "${NAMESPACE}" \
                --from-literal=cacheName="${CACHE_NAME}" \
                --from-literal=cacheUID="${CACHE_UID}"
              kubectl delete aimartifact -n "${NAMESPACE}" \
                -l aim.eai.amd.com/service.name=cache-deleted-dedicated-svc
              kubectl delete aimtemplatecache "${CACHE_NAME}" -n "${NAMESPACE}"

    - name: Verify InferenceService still has PVC volumes after cache deletion
      try:
        - script:
            timeout: 60s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              PVC_COUNT=$(kubectl get inferenceservice -n "${NAMESPACE}" \
                -l aim.eai.amd.com/service=cache-deleted-dedicated-svc \
                -o jsonpath='{range .items[*].spec.predictor.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' \
                | grep -c .)
              echo "Found ${PVC_COUNT} PVC volume(s) on InferenceService after cache deletion"
              [ "${PVC_COUNT}" -ge 1 ]

    - name: Wait for a replacement dedicated cache to become Ready
      try:
        - script:
            timeout: 300s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              OLD_CACHE_UID=$(kubectl get configmap cache-deleted-dedicated-state \
                -n "${NAMESPACE}" -o jsonpath='{.data.cacheUID}')
              for i in $(seq 1 150); do
                CACHE_INFO=$(kubectl get aimtemplatecache -n "${NAMESPACE}" \
                  -l aim.eai.amd.com/service.name=cache-deleted-dedicated-svc \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"|"}{.metadata.uid}{"|"}{.status.status}{"\n"}{end}' \
                  2>/dev/null || true)
                echo "Poll ${i}: replacement cache=${CACHE_INFO:-not created}"
                if [ -n "${CACHE_INFO}" ]; then
                  CACHE_NAME=$(printf '%s' "${CACHE_INFO}" | cut -d'|' -f1)
                  CACHE_UID=$(printf '%s' "${CACHE_INFO}" | cut -d'|' -f2)
                  CACHE_STATUS=$(printf '%s' "${CACHE_INFO}" | cut -d'|' -f3)
                  if [ "${CACHE_UID}" = "${OLD_CACHE_UID}" ]; then
                    echo "Waiting for the original cache UID to disappear"
                  elif [ "${CACHE_STATUS}" = "Ready" ]; then
                    echo "Replacement cache ${CACHE_NAME} is Ready with new UID ${CACHE_UID}"
                    exit 0
                  elif [ "${CACHE_STATUS}" = "Failed" ]; then
                    echo "ERROR: replacement cache ${CACHE_NAME} failed"
                    exit 1
                  fi
                fi
                sleep 2
              done
              echo "ERROR: no ready replacement cache was observed"
              exit 1

    - name: Verify service references the replacement cache and recovers
      try:
        - script:
            timeout: 180s
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              OLD_CACHE_UID=$(kubectl get configmap cache-deleted-dedicated-state \
                -n "${NAMESPACE}" -o jsonpath='{.data.cacheUID}')
              for i in $(seq 1 90); do
                CACHE_UID=$(kubectl get aimtemplatecache -n "${NAMESPACE}" \
                  -l aim.eai.amd.com/service.name=cache-deleted-dedicated-svc \
                  -o jsonpath='{.items[0].metadata.uid}' 2>/dev/null || true)
                SERVICE_STATUS=$(kubectl get aimservice cache-deleted-dedicated-svc \
                  -n "${NAMESPACE}" -o jsonpath='{.status.status}' 2>/dev/null || true)
                CACHE_REF_UID=$(kubectl get aimservice cache-deleted-dedicated-svc \
                  -n "${NAMESPACE}" -o jsonpath='{.status.cache.templateCacheRef.uid}' \
                  2>/dev/null || true)
                CONDITION=$(kubectl get aimservice cache-deleted-dedicated-svc \
                  -n "${NAMESPACE}" \
                  -o jsonpath='{range .status.conditions[?(@.type=="CacheReady")]}{.status}{" "}{.reason}{"\n"}{end}' \
                  2>/dev/null || true)
                echo "Poll ${i}: service=${SERVICE_STATUS:-unknown}, CacheReady=${CONDITION:-not reported}, cacheUID=${CACHE_UID:-none}, refUID=${CACHE_REF_UID:-none}"

                if [ -n "${CACHE_UID}" ] &&
                   [ "${CACHE_UID}" != "${OLD_CACHE_UID}" ] &&
                   [ "${CACHE_REF_UID}" = "${CACHE_UID}" ] &&
                   [ "${SERVICE_STATUS}" = "Running" ] &&
                   [ "${CONDITION}" = "True CacheReady" ]; then
                  echo "AIMService references the ready replacement cache"
                  exit 0
                fi

                case "${CONDITION}" in
                  "False CacheFailed"|"False CacheLost")
                    echo "ERROR: service reported an unrecoverable cache condition: ${CONDITION}"
                    exit 1
                    ;;
                esac
                sleep 2
              done
              echo "ERROR: service did not reference the ready replacement cache"
              exit 1
