# AIMService with inline CPU-only custom model
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-cpu-only-inline
spec:
  model:
    custom:
      baseImage: docker.io/amdenterpriseai/aim-dummy:0.2.0
      modelSources:
        - modelId: cpu/inline-model
          sourceUri: hf://sshleifer/tiny-gpt2
      # CPU-only hardware (no GPU)
      hardware:
        cpu:
          requests: 500m
  template:
    allowUnoptimized: true
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  replicas: 1
