# First service with custom model
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-dedup-service-1
spec:
  model:
    custom:
      baseImage: docker.io/amdenterpriseai/aim-dummy:0.2.0
      modelSources:
        - modelId: shared/dedup-model
          sourceUri: hf://sshleifer/tiny-gpt2
      hardware:
        gpu:
          requests: 1
  template:
    allowUnoptimized: true
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  replicas: 1
