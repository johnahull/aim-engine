apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: test-custom-profile-svc
spec:
  model:
    name: test-custom-profile-model
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  replicas: 1
  template:
    allowUnoptimized: true
