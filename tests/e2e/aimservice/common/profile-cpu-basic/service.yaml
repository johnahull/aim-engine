# v1alpha2 AIMService using a CPU profile.
# No spec.model — forbidden on v1alpha2 (profile is self-contained).
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: test-cpu-basic-service
spec:
  profile:
    name: test-cpu-basic-profile
  caching:
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  replicas: 1
