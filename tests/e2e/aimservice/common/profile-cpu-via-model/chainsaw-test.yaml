# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMService E2E Test: CPU Profile via real AIMModel (v1alpha2)
#
# Full-chain sibling of profile-cpu-basic. Instead of applying an
# AIMClusterProfile directly, this test seeds a copyable source AIMProfile,
# creates an AIMModel whose profileCopy selector matches the seed, and then
# consumes the model-derived AIMProfile from a v1alpha2 AIMService.
#
# Nothing is frozen or stubbed: the profile controller, profile-set controller,
# model controller, and service controller all reconcile naturally end-to-end.
#
# Gated on `requires: nfd` for the same reason as profile-cpu-basic - the
# derived profile inherits acceleratorModel=EPYC_ZEN5 from the seed, which
# needs the feature.node.kubernetes.io/aim-accelerator.EPYC_ZEN5 node label
# produced by the AcceleratorDetector.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: profile-cpu-via-model
  labels:
    requires: nfd
    hf-access: live
spec:
  timeouts:
    assert: 60s
  steps:
    - use:
        template: ../../../_shared/hf-token-step.yaml

    - name: Seed the copyable source AIMProfile
      try:
        - apply:
            file: seed-profile.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMProfile
              metadata:
                name: test-cpu-via-model-seed
              status:
                status: Ready
                version: 0.12.0
                (conditions[?type == 'HardwareAvailable']):
                  - status: "True"
                    reason: HardwareAvailable

    - name: Create the AIMModel that copies the seed
      try:
        - apply:
            file: model.yaml

    - name: Wait for the model to publish its profile set and derived profile
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMModel
              metadata:
                name: test-cpu-via-model
              status:
                status: Ready
                aimId: Qwen/Qwen3-0.6B
                (profileSetRef.name != ""): true
                managedProfiles:
                  total: 1
                  ready: 1

    - name: Resolve the derived profile name and create the service
      description: |
        The derived profile's name is a deterministic hash of the profile-set
        name plus the candidate identity; rather than hardcoding the hash we
        look it up via the aim.eai.amd.com/profile-set-name annotation the
        profile-set controller stamps on its managed profiles.
      try:
        - script:
            timeout: 30s
            content: |
              set -eu

              # Always target v1alpha2 explicitly. kubectl defaults to the first
              # served version for a CRD, which currently resolves to v1alpha1
              # and strips v1alpha2-only status fields (profileSetRef, etc.) via
              # the conversion webhook.
              MODEL_GV=aimmodels.v1alpha2.aim.eai.amd.com
              PROFILE_GV=aimprofiles.v1alpha2.aim.eai.amd.com

              PROFILE_SET=$(kubectl get "$MODEL_GV" -n "$NAMESPACE" test-cpu-via-model \
                -o jsonpath='{.status.profileSetRef.name}')
              if [ -z "$PROFILE_SET" ]; then
                echo "ERROR: model.status.profileSetRef.name is empty"
                kubectl get "$MODEL_GV" -n "$NAMESPACE" test-cpu-via-model -o yaml
                exit 1
              fi
              echo "ProfileSet: $PROFILE_SET"

              DERIVED=$(kubectl get "$PROFILE_GV" -n "$NAMESPACE" -o json \
                | jq -r --arg set "$PROFILE_SET" \
                    '.items[]
                      | select(.metadata.annotations["aim.eai.amd.com/profile-set-name"] == $set)
                      | .metadata.name' \
                | head -1)
              if [ -z "$DERIVED" ]; then
                echo "ERROR: no AIMProfile found with profile-set-name annotation $PROFILE_SET"
                kubectl get "$PROFILE_GV" -n "$NAMESPACE" -o yaml
                exit 1
              fi
              echo "Derived profile: $DERIVED"

              kubectl wait --for=jsonpath='{.status.status}'=Ready \
                --timeout=60s \
                -n "$NAMESPACE" "$PROFILE_GV/$DERIVED"

              # cluster-auth/* annotations propagate to the InferenceService;
              # the foreign annotation must not.
              cat <<EOF | kubectl apply -n "$NAMESPACE" -f -
              apiVersion: aim.eai.amd.com/v1alpha2
              kind: AIMService
              metadata:
                name: test-cpu-via-model-service
                annotations:
                  cluster-auth/allowed-group: test-allowed-group
                  example.com/ignored: drop-me
              spec:
                profile:
                  name: $DERIVED
                caching:
                  env:
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: huggingface-creds
                          key: token
                replicas: 1
              EOF

    - name: Assert the service resolves the derived profile
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-via-model-service
              status:
                (conditions[?type == 'ProfileReady']):
                  - status: "True"
                    reason: ProfileResolved
                resolvedProfile:
                  scope: Namespace

    - name: Assert the InferenceService references the projected runtime, inlining nothing
      description: |
        Post slice-06 the AIMService retires the inline predictor: the overlay
        sets predictor.model.modelFormat=huggingface and references the eager
        namespace runtime aim-<derived> by name, carrying no inline predictor
        image/container. model-id is derived from the resolved profile's modelId
        and cluster-auth is propagated from the AIMService.
      try:
        - assert:
            resource:
              apiVersion: serving.kserve.io/v1beta1
              kind: InferenceService
              metadata:
                labels:
                  aim.eai.amd.com/service: test-cpu-via-model-service
                annotations:
                  aim.eai.amd.com/model-id: Qwen/Qwen3-0.6B
                  cluster-auth/allowed-group: test-allowed-group
              spec:
                predictor:
                  model:
                    modelFormat:
                      name: huggingface

    - name: Assert the ISVC binds the eager namespace runtime and inlines no predictor
      description: |
        The runtime name is aim-<derived> where <derived> is a content hash, so
        recompute it (as the create step did) and assert the ISVC references it,
        that the eager AIMProfile→ServingRuntime projection materialized that
        runtime owner-ref'd by the derived AIMProfile carrying the seed base
        image, that the colocated profile ConfigMap exists, and that the overlay
        inlined no predictor image/container.
      try:
        - script:
            timeout: 60s
            content: |
              set -eu
              MODEL_GV=aimmodels.v1alpha2.aim.eai.amd.com
              PROFILE_GV=aimprofiles.v1alpha2.aim.eai.amd.com

              PROFILE_SET=$(kubectl get "$MODEL_GV" -n "$NAMESPACE" test-cpu-via-model \
                -o jsonpath='{.status.profileSetRef.name}')
              DERIVED=$(kubectl get "$PROFILE_GV" -n "$NAMESPACE" -o json \
                | jq -r --arg set "$PROFILE_SET" \
                    '.items[]
                      | select(.metadata.annotations["aim.eai.amd.com/profile-set-name"] == $set)
                      | .metadata.name' \
                | head -1)
              if [ -z "$DERIVED" ]; then
                echo "ERROR: could not resolve derived profile name"
                exit 1
              fi
              RUNTIME="aim-$DERIVED"
              echo "Derived profile: $DERIVED ; runtime: $RUNTIME"

              ISVC=$(kubectl get inferenceservice -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=test-cpu-via-model-service \
                -o jsonpath='{.items[0].metadata.name}')

              REF=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" \
                -o jsonpath='{.spec.predictor.model.runtime}')
              if [ "$REF" != "$RUNTIME" ]; then
                echo "ERROR: ISVC references runtime '$REF', want '$RUNTIME'"
                exit 1
              fi

              MODEL_IMAGE=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" \
                -o jsonpath='{.spec.predictor.model.image}')
              CONTAINERS=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" \
                -o jsonpath='{.spec.predictor.containers}')
              if [ -n "$MODEL_IMAGE" ] || [ -n "$CONTAINERS" ]; then
                echo "ERROR: overlay inlined a predictor (image='$MODEL_IMAGE' containers='$CONTAINERS')"
                exit 1
              fi

              # Eager namespace ServingRuntime, owned by the derived AIMProfile,
              # carrying the seed base image.
              SR_IMAGE=$(kubectl get servingruntime -n "$NAMESPACE" "$RUNTIME" \
                -o jsonpath='{.spec.containers[0].image}')
              if [ "$SR_IMAGE" != "registry.example.com/aim-cpu-base:0.12.0" ]; then
                echo "ERROR: ServingRuntime image '$SR_IMAGE' != seed base image"
                kubectl get servingruntime -n "$NAMESPACE" "$RUNTIME" -o yaml
                exit 1
              fi
              OWNER=$(kubectl get servingruntime -n "$NAMESPACE" "$RUNTIME" \
                -o jsonpath='{.metadata.ownerReferences[?(@.kind=="AIMProfile")].name}')
              if [ "$OWNER" != "$DERIVED" ]; then
                echo "ERROR: ServingRuntime owner '$OWNER' != derived profile '$DERIVED'"
                exit 1
              fi

              # Colocated profile ConfigMap of the same name as the runtime.
              kubectl get configmap -n "$NAMESPACE" "$RUNTIME" >/dev/null
              echo "OK: ISVC references $RUNTIME; eager SR + ConfigMap materialized; no inline predictor"

    - name: Assert the foreign annotation is NOT propagated to the InferenceService
      try:
        - script:
            timeout: 30s
            content: |
              set -eu
              ISVC=$(kubectl get inferenceservice -n "$NAMESPACE" \
                -l aim.eai.amd.com/service=test-cpu-via-model-service \
                -o jsonpath='{.items[0].metadata.name}')
              VAL=$(kubectl get inferenceservice -n "$NAMESPACE" "$ISVC" \
                -o jsonpath='{.metadata.annotations.example\.com/ignored}')
              if [ -n "$VAL" ]; then
                echo "ERROR: foreign annotation example.com/ignored leaked onto InferenceService: $VAL"
                exit 1
              fi
              echo "OK: foreign annotation was not propagated"

    - name: Assert the service reaches Starting status
      try:
        - assert:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: test-cpu-via-model-service
              status:
                status: Starting
