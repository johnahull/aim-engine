# Public Qwen3-8B medical LoRA used by the live validation. Its Kubernetes name
# becomes both the on-disk directory and the model id exposed by vLLM.
#
# compatibleWith uses logical base-model compatibility rather than binding the
# adapter's lifecycle to one concrete model AIMArtifact.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: qwen3-8b-medical-lora
spec:
  type: adapter
  modelId: XinyuanWang/qwen3-8b-medical-lora
  compatibleWith:
    - Qwen/Qwen3-8B
  sourceUri: hf://XinyuanWang/qwen3-8b-medical-lora
  rank: 16
