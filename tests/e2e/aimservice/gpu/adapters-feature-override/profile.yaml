# Namespaced Qwen2.5-0.5B profile for MI300X that deliberately omits
# features: [adapters].
#
# The service explicitly asserts the missing capability through
# spec.profileOverrides.features, so the controller derives a service-owned
# overlay without mutating this shared seed profile.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMProfile
metadata:
  name: qwen25-05b-no-adapters-feature
spec:
  aimId: Qwen/Qwen2.5-0.5B-Instruct
  modelId: Qwen/Qwen2.5-0.5B-Instruct
  engine: vllm
  metric: latency
  precision: fp16
  type: unoptimized
  primary: true
  acceleratorModel: MI300X
  acceleratorType: gpu
  acceleratorCount: 1
  image: amdenterpriseai/aim-base:0.13
  modelSources:
    - modelId: Qwen/Qwen2.5-0.5B-Instruct
      sourceUri: hf://Qwen/Qwen2.5-0.5B-Instruct
      # Public model is about 1.0 GB including tokenizer/config files.
      size: 2Gi
  caching:
    enabled: true
  engineArgs:
    gpu-memory-utilization: 0.9
    max-model-len: 2048
    max-num-batched-tokens: 1024
    max-num-seqs: 4
    tensor-parallel-size: 1
