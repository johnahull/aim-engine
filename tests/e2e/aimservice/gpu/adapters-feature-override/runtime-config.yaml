apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMRuntimeConfig
metadata:
  name: adapters-feature-override
spec:
  routing:
    enabled: true
    gatewayRef:
      name: kserve-ingress-gateway
      namespace: envoy-gateway-system
    # Namespace in the path so leftover/parallel runs don't collide on the
    # shared gateway. validate-adapter-loaded.sh hits this base path + /models.
    pathTemplate: "/integration/adapters-feature-override/{.metadata.namespace}/{.metadata.name}"
    requestTimeout: "180s"
