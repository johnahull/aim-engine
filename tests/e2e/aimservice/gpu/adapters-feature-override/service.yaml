# The seed profile intentionally has no adapter feature. The explicit
# profileOverrides.features assertion makes AIM Engine fork an adapter-capable
# overlay; spec.adapters then mounts the service's subtree at /adapters.
apiVersion: aim.eai.amd.com/v1alpha2
kind: AIMService
metadata:
  name: qwen25-05b-lora
spec:
  runtimeConfigName: adapters-feature-override
  profile:
    name: qwen25-05b-no-adapters-feature
  profileOverrides:
    features:
      - adapters
  # Enable vLLM's internal load/unload handlers; the generated Gateway route
  # must still keep those mutation APIs inaccessible to end users.
  adapterMode: dynamic
  adapterRuntime:
    maxRank: 16
  adapters:
    - name: qwen25-05b-lora
      kind: AIMArtifact
  replicas: 1
