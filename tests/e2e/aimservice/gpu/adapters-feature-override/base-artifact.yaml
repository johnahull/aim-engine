# Pre-created Qwen2.5-0.5B model artifact with the shared RWX adapter disk used by
# both the staging Job and the inference pod.
#
# The profile cache adopts this artifact because modelId/sourceUri match the
# profile exactly. Pre-creating it makes the storage contract explicit and
# keeps this live test independent from cluster-wide adapter-disk defaults.
apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMArtifact
metadata:
  name: qwen25-05b-base
spec:
  type: model
  modelId: Qwen/Qwen2.5-0.5B-Instruct
  sourceUri: hf://Qwen/Qwen2.5-0.5B-Instruct
  size: 2Gi
  adapterDisk:
    size: 1Gi
    storageClassName: longhorn
