# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
#
# AIMClusterModelSource CEL: spec.filters vs spec.images
#
# filters and images remain mutually exclusive; models may coexist with either.
#
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: aimclustermodelsource-filters-images-exclusivity
spec:
  description: CEL rejects spec when both filters and images are set, or when neither is set
  timeouts:
    assert: 30s
  steps:
    - name: Reject source with both filters and images
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-cel-both-filters-and-images
              spec:
                maxModels: 5
                filters:
                  - image: amdenterpriseai/aim-qwen-qwen3-32b:0.8.4
                images:
                  - amdenterpriseai/aim-meta-llama-llama-3-2-1b-instruct:0.8.4

    - name: Reject source with neither filters nor images
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-cel-neither-filters-nor-images
              spec:
                maxModels: 5
                syncInterval: 1h

    - name: Accept models without registry inputs
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-cel-models-only
              spec:
                models:
                  - modelId: Qwen/Qwen3.5-0.8B

    - name: Accept models alongside images
      try:
        - apply:
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-cel-models-and-images
              spec:
                images:
                  - amdenterpriseai/aim-qwen-qwen3-32b:0.8.4
                models:
                  - modelId: Qwen/Qwen3.5-0.8B

    - name: Reject duplicate model IDs
      try:
        - apply:
            expect:
              - check:
                  ($error != null): true
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMClusterModelSource
              metadata:
                name: test-cel-duplicate-models
              spec:
                models:
                  - modelId: Qwen/Qwen3.5-0.8B
                  - modelId: Qwen/Qwen3.5-0.8B
