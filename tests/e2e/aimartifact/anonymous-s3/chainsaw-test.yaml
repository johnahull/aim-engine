apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: anonymous-s3
spec:
  description: >
    Verifies anonymous (UNSIGNED) S3 access: a public MinIO bucket is read with
    no credentials, requested explicitly via AIM_S3_ANONYMOUS. Exercises the
    downloader's public-bucket code path end to end (anonymous list + stat in
    the size job, anonymous list + get in the download job).

    The sibling credential-resolution-s3 test covers the other two ways to get
    here: the "anonymous" sentinel key, and omitting credentials entirely (which
    must NOT be read as a public bucket).
  steps:
    - name: Deploy Minio
      try:
        - apply:
            file: minio-service.yaml
        - apply:
            file: minio-deployment.yaml

    - name: Wait for Minio to be ready
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: minio
              status:
                availableReplicas: 1

    - name: Create bucket, seed objects, make public
      try:
        - apply:
            file: minio-setup-job.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: minio-setup
              status:
                (succeeded != null): true
                succeeded: 1

    - name: Create artifact (no credentials)
      try:
        - apply:
            file: artifact.yaml

    - name: Assert the cache gets ready via anonymous access
      try:
        - assert:
            timeout: 3m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: anonymous-s3
              status:
                status: Ready
                (discoveredSizeBytes != null): true
                progress:
                  percentage: 100
