apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failure-missing-prefix-s3
spec:
  description: >
    A valid, non-empty bucket but a prefix with no objects. Unlike a missing
    bucket (NoSuchBucket), an empty listing raises no boto3 error: the
    downloader exits with "No objects found". Verifies the operator classifies
    that as SourceNotFound rather than a generic pod failure.
  steps:
    - name: Deploy Minio
      try:
        - apply:
            file: minio-service.yaml
        - apply:
            file: minio-deployment.yaml

    - name: Wait for Minio to be ready
      try:
        - assert:
            timeout: 60s
            resource:
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: minio
              status:
                availableReplicas: 1

    - name: Create bucket and seed an object under a different prefix
      try:
        - apply:
            file: minio-setup-job.yaml
        - assert:
            timeout: 60s
            resource:
              apiVersion: batch/v1
              kind: Job
              metadata:
                name: minio-setup
              status:
                (succeeded != null): true
                succeeded: 1

    - name: Create artifact pointing at an empty prefix
      try:
        - apply:
            file: artifact.yaml

    - name: Assert the failure is classified as SourceNotFound
      try:
        - assert:
            timeout: 3m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                name: failure-missing-prefix-s3
              status:
                status: "Failed"
                progress:
                  displayPercentage: "N/A"
                (conditions[?type == 'Ready']):
                  - status: "False"
                    reason: "InvalidSpec"
                (conditions[?type == 'DownloadJobPodsReady']):
                  - status: "False"
                    reason: "SourceNotFound"
