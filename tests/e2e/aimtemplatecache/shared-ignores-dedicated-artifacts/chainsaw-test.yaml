apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: template-cache-shared-ignores-dedicated-artifacts
  labels:
    hf-access: live
spec:
  timeouts:
    assert: 10m
  steps:
    - use:
        template: ../../_shared/hf-token-step.yaml

    - name: Create shared mode service
      try:
        - apply:
            file: service.yaml

    - name: Wait for shared service cache ref
      try:
        - assert:
            timeout: 5m
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMService
              metadata:
                name: shared-artifact-owner-service
              status:
                cache:
                  templateCacheRef:
                    (name != ''): true

    - name: Verify artifacts used by shared cache are unowned
      try:
        - script:
            timeout: 5m
            env:
              - name: NAMESPACE
                value: ($namespace)
            content: |
              set -eu
              CACHE_NAME="$(kubectl -n "$NAMESPACE" get aimservice shared-artifact-owner-service -o jsonpath='{.status.cache.templateCacheRef.name}')"
              # Shared artifact names are not scoped to a cache, so several caches can
              # resolve one artifact and the template-cache.name label records only
              # whichever of them created it. Read the set to check off the cache itself.
              for i in $(seq 1 30); do
                NAMES="$(kubectl -n "$NAMESPACE" get aimtemplatecache "$CACHE_NAME" -o jsonpath='{.status.artifacts.*.name}' 2>/dev/null || true)"
                if [ -n "$NAMES" ]; then
                  BAD=0
                  for name in $NAMES; do
                    OWNERS="$(kubectl -n "$NAMESPACE" get aimartifact "$name" -o jsonpath='{.metadata.ownerReferences}' 2>/dev/null || echo absent)"
                    if [ -n "$OWNERS" ]; then
                      BAD=1
                    fi
                  done
                  if [ "$BAD" -eq 0 ]; then
                    exit 0
                  fi
                fi
                sleep 2
              done
              echo "expected artifacts resolved by shared cache $CACHE_NAME to have no ownerReferences"
              kubectl -n "$NAMESPACE" get aimtemplatecaches.aim.eai.amd.com -o yaml
              kubectl -n "$NAMESPACE" get aimartifacts.aim.eai.amd.com -o yaml
              exit 1
