apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: template-cache-happy-path-cluster
spec:
  timeouts:
    assert: 180s
  steps:
    - name: Create frozen service template with Ready status
      try:
        - apply:
            file: cluster-service-template.yaml
        - script:
            content: |
              apply-with-status.sh cluster-service-template.yaml --status-only

    - name: Create the template cache
      try:
        - apply:
            file: template-cache.yaml

    - name: Ensure both artifacts are created
      description: >
        The template has two distinct model sources, so the cache must create two
        separate AIMArtifacts. Match each by its stable identity (sourceUri)
        rather than the positional template.index label, which is an unstable
        internal detail nothing consumes.
      try:
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                labels:
                  aim.eai.amd.com/template-cache.name: happy-path-cluster
                  aim.eai.amd.com/template.scope: "Cluster"
              spec:
                sourceUri: hf://HuggingFaceTB/SmolLM2-135M
                size: 2Gi
                env:
                  - name: HF_TOKEN
                    value: my-token
        - assert:
            timeout: 180s
            resource:
              apiVersion: aim.eai.amd.com/v1alpha1
              kind: AIMArtifact
              metadata:
                labels:
                  aim.eai.amd.com/template-cache.name: happy-path-cluster
                  aim.eai.amd.com/template.scope: "Cluster"
              spec:
                sourceUri: hf://sshleifer/tiny-gpt2
                size: 4Gi

    # TODO add an assert to check the template cache becomes ready (once the artifact is merged)