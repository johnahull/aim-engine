apiVersion: aim.eai.amd.com/v1alpha1
kind: AIMService
metadata:
  name: legacy-always-service
spec:
  model:
    image: docker.io/amdenterpriseai/aim-dummy:0.2.0
  caching:
    mode: Always
    env:
      - name: HF_TOKEN
        valueFrom:
          secretKeyRef:
            name: huggingface-creds
            key: token
  replicas: 1
