apiVersion: v1
kind: Namespace
metadata:
  name: zot-system
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zot-selfsigned
  namespace: zot-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-ca
  namespace: zot-system
spec:
  commonName: aim-engine-kind-zot-ca
  isCA: true
  secretName: zot-ca
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: zot-selfsigned
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: zot-ca
  namespace: zot-system
spec:
  ca:
    secretName: zot-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zot-server
  namespace: zot-system
spec:
  secretName: zot-server-tls
  duration: 168h
  renewBefore: 24h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - zot
    - zot.zot-system
    - zot.zot-system.svc
    - zot.zot-system.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: zot-ca
